<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>KLARTeXt. Magazin - QR Code Generator</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>

    :root {
      --bg: #f6f2eb;
      --paper: #fffefb;
      --text: #222;
      --muted: #666;
      --green: #a9bf7a;
      --green-dark: #8aa35c;
      --blue: #c9dff0;
      --shadow: 0 10px 40px rgba(0,0,0,.08);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      font-weight: 300;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,.4), transparent 25%),
        radial-gradient(circle at 80% 10%, rgba(255,255,255,.2), transparent 20%);
      opacity: .45;
      pointer-events: none;
    }

    /* ── NAV ── */

    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      background: rgba(246,242,235,.78);
      border-bottom: 1px solid rgba(0,0,0,.05);
      padding: calc(14px + env(safe-area-inset-top)) 22px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nav-logo-img {
      height: 56px;
      width: auto;
      display: block;
    }

    /* ── HERO ── */

    .hero {
      text-align: center;
      padding: 60px 24px 40px;
    }

    .hero-eyebrow {
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 16px;
    }

    .hero h1 {
      font-family: 'Arial Narrow', Arial, sans-serif;
      font-weight: 700;
      text-transform: uppercase;
      font-size: clamp(2rem, 6vw, 3.1rem);
      line-height: 1.05;
      color: var(--text);
      margin-bottom: 18px;
    }

    .hero h1 span {
      color: var(--green-dark);
    }

    .hero-divider {
      width: 46px;
      height: 2px;
      background: var(--green-dark);
      margin: 0 auto;
      opacity: .5;
    }

    /* ── CARD ── */

    .wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      padding: 30px 20px 80px;
    }

    .card {
      width: 100%;
      max-width: 560px;
      background: var(--paper);
      border-radius: 28px;
      padding: 42px 34px;
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .card::before {
      content: "";
      position: absolute;
      top: -70px; right: -70px;
      width: 220px; height: 220px;
      background: var(--green);
      border-radius: 50%;
      opacity: .28;
    }

    .card::after {
      content: "";
      position: absolute;
      bottom: -100px; left: -100px;
      width: 260px; height: 260px;
      background: var(--blue);
      border-radius: 50%;
      opacity: .35;
    }

    .card-label {
      position: relative;
      z-index: 2;
      display: inline-block;
      background: #0f0f0f;
      color: #fff;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: .72rem;
      letter-spacing: .12em;
      margin-bottom: 26px;
    }

    /* ── INPUT ── */

    .input-wrap {
      position: relative;
      z-index: 2;
      margin-bottom: 18px;
    }

    input {
      width: 100%;
      padding: 16px 18px;
      border-radius: 18px;
      border: 1px solid rgba(0,0,0,.08);
      background: #f5f5f1;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      font-size: 0.92rem;
      font-weight: 400;
      color: var(--text);
      outline: none;
      transition: border-color 0.22s ease, box-shadow 0.22s ease;
    }

    input:focus {
      border-color: var(--green-dark);
      box-shadow: 0 0 0 4px rgba(138,163,92,0.10);
    }

    /* ── BUTTON ── */

    .btn-generate {
      position: relative;
      z-index: 2;
      width: 100%;
      border: none;
      border-radius: 22px;
      padding: 18px 24px;
      cursor: pointer;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #fff;
      background: linear-gradient(145deg, var(--green-dark), #79995a);
      box-shadow: 0 10px 22px rgba(0,0,0,.14), inset 0 1px 1px rgba(255,255,255,.25);
      transition: transform 0.22s ease, box-shadow 0.22s ease;
      margin-bottom: 30px;
    }

    .btn-generate:hover {
      transform: translateY(-2px) scale(1.01);
      box-shadow: 0 16px 32px rgba(138,163,92,0.28), inset 0 1px 1px rgba(255,255,255,.25);
    }

    /* ── QR ── */

    #qr-wrap {
      position: relative;
      z-index: 2;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 22px;
    }

    #qr-wrap.visible {
      display: flex;
    }

    #qrcode {
      padding: 22px;
      border-radius: 24px;
      background: #fff;
      border: 1px solid rgba(0,0,0,.05);
      box-shadow: 0 8px 26px rgba(0,0,0,.06);
    }

    #qrcode canvas,
    #qrcode img {
      display: block;
    }

    /* ── DOWNLOAD ── */

    .download-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 15px 24px;
      border: none;
      border-radius: 18px;
      cursor: pointer;
      background: rgba(169,191,122,.18);
      color: var(--text);
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      font-size: 0.82rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .download-btn:hover {
      transform: translateY(-2px);
      background: rgba(169,191,122,.32);
    }

    .hint {
      font-size: 0.80rem;
      line-height: 1.8;
      color: var(--muted);
    }

    /* ── FOOTER ── */

    .footer {
      position: relative;
      z-index: 2;
      margin-top: 30px;
      text-align: center;
      color: #777;
    }

    .footer-main { font-size: .82rem; }
    .footer-copy { margin-top: 6px; font-size: .72rem; opacity: .7; }

    /* ── MOBILE ── */

    @media (max-width: 480px) {
      .hero { padding-top: 44px; }
      .card { padding: 28px 18px; border-radius: 22px; }
      #qrcode { padding: 16px; }
    }

  </style>
</head>

<body>

  <nav>
    <img
      src="Klartext-logo.png"
      alt="KLARTeXt – Das Magazin mit Haltung"
      class="nav-logo-img"
    />
  </nav>

  <section class="hero">
    <p class="hero-eyebrow">KLARTeXt. Das Magazin mit Haltung</p>
    <h1>QR-Code<br><span>Generator</span></h1>
    <div class="hero-divider"></div>
  </section>

  <div class="wrapper">
    <div class="card">

      <div class="card-label">Nur für internen Gebrauch</div>

      <div class="input-wrap">
        <input
          type="url"
          id="urlInput"
          placeholder="https://magazin-klartext.github.io/zeit-fuer-dich/"
          value="https://magazin-klartext.github.io/zeit-fuer-dich/"
        />
      </div>

      <button class="btn-generate" onclick="generateQR()">
        QR-Code generieren
      </button>

      <div id="qr-wrap">
        <div id="qrcode"></div>
        <button class="download-btn" onclick="downloadQR()">
          ⬇ Als PNG herunterladen
        </button>
        <p class="hint">Für den Print.</p>
      </div>

      <div class="footer">
        <div class="footer-main">KLARTeXt. ECHT. MUTIG. KLAR.</div>
        <div class="footer-copy">© 2026 KLARTeXt. Das Magazin mit Haltung</div>
      </div>

    </div>
  </div>

  <script>
    let qrInstance = null;

    function generateQR() {
      const url = document.getElementById('urlInput').value.trim();
      if (!url) return;

      const wrap = document.getElementById('qr-wrap');
      const container = document.getElementById('qrcode');

      container.innerHTML = '';
      qrInstance = null;

      qrInstance = new QRCode(container, {
        text: url,
        width: 220,
        height: 220,
        colorDark: '#1a1a1a',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.H
      });

      wrap.classList.add('visible');
    }

    function downloadQR() {
      const canvas = document.querySelector('#qrcode canvas');
      if (!canvas) return;
      const link = document.createElement('a');
      link.download = 'klartext-qrcode.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    window.addEventListener('load', generateQR);
  </script>

</body>
</html>
